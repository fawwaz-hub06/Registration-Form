<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registartion Form-by FAWWAZ</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
</head>

<body>
    <form action="">
        <div class="form-container">

            <h2>Registartion-Form</h2>

            <div class="inputs-container">

                <div>
                    <img src="/left image.jpg" alt="">
                </div>

                <div>
                    <div class="form">
                        <!-- <div class="leftimage">
                    <img src="/left image.jpg" alt="">
                    </div> -->
                        <input type="text" name="name" id="name" placeholder="Your Name" required>
                    </div>
                    <div class="form">
                        <!-- <label for="">DOB</label> -->
                        <input type="date" name="DOB" id="DOB" placeholder="Date Of Birth" aria-placeholder="DOB">
                    </div>
                    <div class="form">
                        <input type="number" name="Age" id="Age" placeholder="Age">
                    </div>
                    <div class="form">
                        <input type="text" name="Password" id="Password" placeholder="Password" required>
                    </div>
                    <div class="form">
                        <input type="text" name="Mobile Number" id="Mobile Number" placeholder="Mobile Number" required>
                    </div>
                    <div class="radio">
                        <input type="radio" name="gender" id="male" value="Male" required>
                        <label for="radio">Male</label>
                        <input type="radio" name="gender" id="female" value="female" required>
                        <label for="radio">Female</label>
                    </div>
                    <div class="buttons">
                        <button type="submit">Submit</button>
                        <button type="reset">Reset</button>
                    </div>
                </div>
    </form>
</body>

</html>
